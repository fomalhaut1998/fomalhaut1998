    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1/3 还原并运行脚本
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p scripts
          printf '%s' "$SCRIPT_HEATMAP_B64" | tr -d '\n' | base64 -d > scripts/contrib-heatmap.mjs
          printf '%s' "$SCRIPT_STATS_B64"   | tr -d '\n' | base64 -d > scripts/github-stats.mjs
          node scripts/contrib-heatmap.mjs
          node scripts/github-stats.mjs

      - name: 2/3 提交回 main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-heatmap.svg assets/contrib-heatmap-light.svg assets/github-stats.svg assets/github-stats-light.svg assets/contrib-data.json
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: 更新 GitHub 数据卡片 [skip ci]"
            git push
          fi
