    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1/5 还原脚本
        run: |
          mkdir -p scripts
          printf '%s' "$SCRIPT_HEATMAP_B64"   | tr -d '\n' | base64 -d > scripts/contrib-heatmap.mjs
          printf '%s' "$SCRIPT_STATS_B64"     | tr -d '\n' | base64 -d > scripts/github-stats.mjs
          printf '%s' "$SCRIPT_ACTIVITY_B64"  | tr -d '\n' | base64 -d > scripts/activity-chart.mjs
          printf '%s' "$SCRIPT_DASHBOARD_B64" | tr -d '\n' | base64 -d > scripts/dashboard.mjs

      - name: 2/5 贡献热力图
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/contrib-heatmap.mjs

      - name: 3/5 数据看板 + 活动曲线 + 简单统计卡
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/dashboard.mjs
          node scripts/activity-chart.mjs
          node scripts/github-stats.mjs

      - name: 更新 README 里的「最后更新于」日期
        run: |
          DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          sed -i -E "s/最后更新于 [0-9]{4}-[0-9]{2}-[0-9]{2}/最后更新于 ${DATE}/" README.md
          git add README.md

      - name: 5/5 提交回 main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-heatmap.svg assets/contrib-heatmap-light.svg \
                  assets/dashboard.svg assets/dashboard-light.svg \
                  assets/activity.svg assets/activity-light.svg \
                  assets/github-stats.svg assets/github-stats-light.svg \
                  assets/contrib-data.json
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: 更新 GitHub 数据卡片 [skip ci]"
            git push
          fi
