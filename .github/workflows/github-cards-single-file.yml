# 单文件版：一个 workflow 同时生成「贡献热力图 + 数据卡片」（深色 + 浅色共 4 张图）
# 用法：把本文件存成 .github/workflows/github-cards.yml，手动 Run 一次即可。
# 不需要另外放 scripts/ 文件 —— 脚本内容用 base64 内嵌，而且 base64 不吃 YAML 缩进，
# 从根上避免「把工作流内容粘进 .mjs」这类串档问题。
name: 生成 GitHub 数据卡片

on:
  schedule:
    - cron: '23 1 * * *'        # 每天 09:23（北京时间）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-cards
  cancel-in-progress: true

