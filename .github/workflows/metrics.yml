# 官方 lowlighter/metrics（用户选定，2026-10-06）
# 位置：.github/workflows/metrics.yml
#
# ⚠️ 关键点（官方文档 + 实测）：
#   1) metrics 默认 output_action 就是 commit —— 它自己会把渲染结果提交进仓库，
#      **不要**再自己写 git add/commit 步骤（那个文件在容器内，工作站里看不到：
#      fatal: pathspec 'metrics.svg' did not match any files）。
#   2) 因此也不需要 actions/checkout。
#   3) 必须配 PAT（Secret 名 METRICS_TOKEN）：用户级数据（issues、PR、评论、提交、活动等）
#      用默认 GITHUB_TOKEN 读不到，不配的话卡片基本是空的。
#      GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic)
#      → 勾 repo + read:user（要组织再加 read:org）→ 仓库 Settings → Secrets and variables
#      → Actions → New repository secret → 名称 METRICS_TOKEN
name: Metrics 信息图

on:
  schedule:
    - cron: '0 16 * * *'     # 16:00 UTC = 次日 00:00 北京时间
  workflow_dispatch:
  # 注意：不要加 push 触发器 —— metrics 会自己提交，而卡片里带日期，内容每次都变，
  # push → 触发 → 再提交 会变成死循环。

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: fomalhaut1998
          filename: metrics.svg
          template: classic
          config_timezone: Asia/Shanghai
          config_animations: yes

          # 左侧指标：header 顶部信息 / activity 活动统计 / repositories 仓库列表 / metadata 元数据
          base: header, activity, repositories, metadata

          # PR 代码增删（截图里 +4336 / -2220 那行）
          plugin_lines: yes

          # 活动曲线（截图右侧多序列）
          plugin_activity: yes
          plugin_activity_limit: 8
          plugin_activity_days: 0
          plugin_activity_filter: issue, pr, review, ref/create, release, fork

          # 底部语言占比条
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_ignored: html, css
